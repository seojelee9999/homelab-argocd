apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 21.4.2

    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: Monolithic

        loki:
          auth_enabled: false

          commonConfig:
            replication_factor: 1

          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          storage:
            type: filesystem

          limits_config:
            retention_period: 168h

          compactor:
            retention_enabled: true
            delete_request_store: filesystem

        singleBinary:
          replicas: 1

          persistence:
            enabled: true
            storageClass: longhorn-database  # 기존에 검증된 스토리지 클래스로 변경 권장
            accessModes:
              - ReadWriteOnce
            size: 20Gi
            whenDeleted: Delete  # 꼬임 방지를 위해 Delete로 변경하여 잔여 락 방지
            whenScaled: Retain

        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0

        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        lokiCanary:
          enabled: true

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
