apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  # The pull Secret must be in the same namespace as the app's Pods.
  namespace: diet-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {
            "auths": {
              "ghcr.io": {
                "username": {{ .GHCR_USERNAME | toJson }},
                "password": {{ .GHCR_TOKEN | toJson }},
                "auth": {{ printf "%s:%s" .GHCR_USERNAME .GHCR_TOKEN | b64enc | toJson }}
              }
            }
          }
  data:
    - secretKey: GHCR_USERNAME
      remoteRef:
        key: /homelab/ghcr/GHCR_USERNAME
    - secretKey: GHCR_TOKEN
      remoteRef:
        key: /homelab/ghcr/GHCR_TOKEN
