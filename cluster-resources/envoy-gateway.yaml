apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: default
  source:
    chart: gateway-helm
    repoURL: oci://docker.io/envoyproxy
    targetRevision: v1.9.2
    helm:
      values: |
        # 필요한 커스텀 설정이 있다면 여기에 작성
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true