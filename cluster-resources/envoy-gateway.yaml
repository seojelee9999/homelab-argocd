apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: default
  source:
    chart: gateway-helm
    repoURL: 'oci://docker.io/envoyproxy'
    targetRevision: v1.9.2  # 원하는 헬름 차트 버전
    helm:
      values: |
        # 필요한 커스텀 설정이 있다면 여기에 작성 (없으면 빈 칸이나 생략 가능)
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true     # Git(또는 선언부)에서 사라지면 리소스도 깔끔하게 제거
      selfHeal: true  # 클러스터에서 수동으로 튜닝한 게 있으면 Git 기준으로 원복
    syncOptions:
      - CreateNamespace=true # 네임스페이스가 없으면 알아서 생성