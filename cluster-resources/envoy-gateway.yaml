apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: default
  source:
    chart: gateway-helm
    repoURL: registry-1.docker.io/envoyproxy  # 혹은 oci://docker.io/envoyproxy
    targetRevision: v1.9.2
    helm:
      values: |
        enableExperimental: true
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true