apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: monitoring
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.11.0 
    helm:
      releaseName: monitoring
      valuesObject:
        grafana:
          enabled: true
        prometheus:
          prometheusSpec:
            retention: 7d
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true     # Git(Helm 차트)에서 제거된 리소스 자동 삭제
      selfHeal: true  # 클러스터 내에서 수동 변경된 내용을 Git 기준으로 자동 복구
    syncOptions:
      - ServerSideApply=true  # 대규모 CRD가 포함된 헬름 차트 적용 시 충돌 방지